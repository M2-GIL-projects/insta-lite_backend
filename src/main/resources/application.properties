spring.application.name=InstaLite

# ===============================
# DATABASE POSTGRES
# ===============================

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.springframework.boot.orm.jpa.SpringJtaPlatform
spring.jpa.hibernate.ddl-auto=update

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
# ===============================
# DATABASE POSTGRES DOCKER
# ===============================

spring.datasource.url=jdbc:postgresql://instalite-db:5432/instadatabase
spring.datasource.username=userinsta
spring.datasource.password=secretinsta


security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000

# ===============================
# UPLOADING
# ===============================
app.upload.dir=src/main/resources/static/uploads

# ===============================
# Support multipart
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# Support FFMPEG
# ===============================
#server.compression.ffmpeg=
#server.compression.ffprobe=


# ===============================
# Support Prometheus
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true